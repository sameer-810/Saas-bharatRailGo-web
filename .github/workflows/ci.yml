# BharatRailGo website — build and Playwright checks on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  landing:
    name: Build + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/verifyLanding.mjs
